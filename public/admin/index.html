<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin | candyzz by chr!s</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

  <header class="navbar container">
    <div class="logo brand-font">CANDYZZ<span>by chr!s</span> <small class="admin-tag">ADMIN</small></div>
    <button id="logout-btn" class="nav-link logout-btn">Cerrar sesión</button>
  </header>

  <main class="container admin-main">
    <h1 class="section-title">Pedidos</h1>

    <div class="stats-bar" id="stats-bar"></div>

    <div class="table-wrapper">
      <table class="admin-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Nombre</th>
            <th>Contacto</th>
            <th>Items</th>
            <th>Total</th>
            <th>Fecha / Hora</th>
            <th>Estado</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="pedidos-tbody">
          <tr><td colspan="8" class="loading-row">Cargando pedidos...</td></tr>
        </tbody>
      </table>
    </div>

    <h1 class="section-title" style="margin-top: 60px;">Productos (Sabores)</h1>

    <div class="form-wrapper" style="margin-bottom: 30px;">
      <form id="producto-form" novalidate>
        <div class="form-group">
          <label for="p-nombre">Nombre</label>
          <input type="text" id="p-nombre" name="nombre" maxlength="100" required>
        </div>
        <div class="form-group">
          <label for="p-descripcion">Descripción</label>
          <input type="text" id="p-descripcion" name="descripcion" maxlength="500">
        </div>
        <div class="form-group">
          <label for="p-color">Color / Degradado (CSS)</label>
          <input type="text" id="p-color" name="estilo_color" maxlength="200" placeholder="linear-gradient(135deg, #c8102e, #8b0000)">
        </div>
        <div class="form-group">
          <label for="p-stock">Stock</label>
          <input type="number" id="p-stock" name="stock" min="0" value="0" required>
        </div>
        <div class="form-group">
          <label for="p-precio">Precio</label>
          <input type="number" id="p-precio" name="precio" min="0" step="0.01" value="0" required>
        </div>
        <button type="submit" class="btn-submit" id="producto-submit-btn">Agregar Producto</button>
        <div id="producto-feedback" class="feedback-msg"></div>
      </form>
    </div>

    <div class="table-wrapper">
      <table class="admin-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Color</th>
            <th>Stock</th>
            <th>Precio</th>
            <th>Estado</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="productos-tbody">
          <tr><td colspan="8" class="loading-row">Cargando productos...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="/admin/admin.js"></script>
</body>
</html>
