<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin | candyzz by chr!s</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

  <header class="navbar container">
    <div class="logo brand-font">CANDYZZ<span>by chr!s</span> <small class="admin-tag">ADMIN</small></div>
    <button id="logout-btn" class="nav-link logout-btn">Cerrar sesión</button>
  </header>

  <main class="container admin-main">
    <h1 class="section-title">Apartados de Xile Chile</h1>

    <div class="stats-bar" id="stats-bar"></div>

    <div class="table-wrapper">
      <table class="admin-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Nombre</th>
            <th>Sabor</th>
            <th>Cantidad</th>
            <th>Fecha / Hora</th>
            <th>Estado</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="apartados-tbody">
          <tr><td colspan="7" class="loading-row">Cargando apartados...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="/admin/admin.js"></script>
</body>
</html>
