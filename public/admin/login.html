<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | candyzz by chr!s</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <h1 class="brand-font login-title">CANDYZZ<span>by chr!s</span></h1>
      <p class="login-subtitle">Panel de administración</p>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>

        <div id="login-feedback" class="feedback-msg"></div>

      <a href="/" class="back-link">&larr; Volver al sitio</a>
    </div>
  </div>

  <script src="/admin/admin-login.js"></script>
